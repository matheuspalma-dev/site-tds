        <title>Sobrevivendo_Na_Siberia</title>

        <style>
            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                border: 0;
                overflow: hidden;
                background: #000;
                color: #cccccc;
            }

            /* Container do jogo: ocupa a janela inteira e centraliza o canvas */
            div.gm4html5_div_class {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                border: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                overflow: hidden;
            }

            canvas {
                display: block;
                image-rendering: optimizeSpeed;
                -webkit-interpolation-mode: nearest-neighbor;
                -ms-touch-action: none;
                touch-action: none;
                margin: 0;
                padding: 0;
                border: 0;
            }

            :-webkit-full-screen #canvas {
                width: 100%;
                height: 100%;
            }
            :-webkit-full-screen {
                width: 100%;
                height: 100%;
            }

            /* Estilos do login do runner */
            div.gm4html5_login {
                padding: 20px;
                position: absolute;
                border: solid 2px #000000;
                background-color: #404040;
                color: #00ff00;
                border-radius: 15px;

            }
            div.gm4html5_cancel_button {
                float: right;
            }
            div.gm4html5_login_button {
                float: left;
            }
            div.gm4html5_login_header {
                text-align: center;
            }

            .back-to-games {
                position: fixed;
                top: 14px;
                left: 18px;
                z-index: 10000;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 12px 20px;
                border: 0;
                border-radius: 9px;
                background: #f2bb16;
                color: #171717;
                font: 700 16px/1.2 Arial, sans-serif;
                text-decoration: none;
                box-shadow: 0 3px 10px #0006;
            }
            .back-to-games:hover { background: #ffd447; }
            .back-to-games:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
            @media (max-width: 520px) {
                .back-to-games { top: 10px; left: 10px; padding: 10px 14px; font-size: 14px; }
            }

            #texto-cheio {
                position: fixed;
                bottom: 14px;
                left: 18px;
                z-index: 10000;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 12px 20px;
                border: 0;
                border-radius: 9px;
                background: #f2bb16;
                color: #171717;
                font: 700 16px/1.2 Arial, sans-serif;
                text-decoration: none;
                box-shadow: 0 3px 10px #0006;

    <body>
        <a class="back-to-games" href="../../jogos.html" aria-label="Voltar para a lista de jogos">&#8592; Voltar ao site</a>
        <a id="texto-cheio">Pressione F10 para jogar em tela cheia</a>

        <div class="gm4html5_div_class" id="gm4html5_div_id">
            <canvas id="canvas" width="1366" height="768">
                <p>Your browser doesn't support HTML5 canvas.</p>
            </canvas>
        </div>

        <!-- Código do jogo -->
        <script type="text/javascript" src="html5game/sobrevivendo_na_siberia.js?cachebust=1574752550"></script>

        <script>
            // Ajusta o canvas para caber na janela mantendo a proporção 1366x768,
            // sem sobrar borda preta em um dos lados (só faixas simétricas, se houver).
            // true  = mantém a proporção (pode sobrar faixa preta simétrica)
            // false = estica o jogo para preencher a tela inteira (pode distorcer)
            var MANTER_PROPORCAO = false;

            function fitCanvas() {
                var canvas = document.getElementById("canvas");
                if (!canvas) return;

                var ratio = 1366 / 768;
                var w = window.innerWidth;
                var h = window.innerHeight;

                if (MANTER_PROPORCAO) {
                    if (w / h > ratio) {
                        w = Math.floor(h * ratio);
                    } else {
                        h = Math.floor(w / ratio);
                    }
                }

                canvas.style.setProperty("width", w + "px", "important");
                canvas.style.setProperty("height", h + "px", "important");
            }

            window.onload = function () {
                GameMaker_Init();
                fitCanvas();
            };
            window.addEventListener("resize", fitCanvas);
            window.addEventListener("orientationchange", fitCanvas);
        </script>
    </body>
</html>
