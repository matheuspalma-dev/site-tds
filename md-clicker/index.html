<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>MD Clicker — Colégio Souza Naves</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nabla&family=Bebas+Neue&family=Oswald:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <a class="voltar" href="../jogos.html">← Voltar ao site</a>

    <div class="GameDiv">
        <div class="Config">
            <div class="configE">
                <p>Configurações</p>
            </div>
        </div>

        <div class="container">
            <div class="canhaoDnevoa">
                <p>Canhão de Névoa</p>
                <p>:</p>
                <p class="CDN"> </p>
                <p>/10</p>
            </div>
            <h1 id="pontos">0</h1>
            <h1 id="mdcoins">MDCOINS</h1>
            <div class="VC">
                <p>Click</p>
                <p>:</p>
                <p class="SCV"> </p>
            </div>
            <img src="https://i.postimg.cc/sQ6KprZW/1.png" alt="batata" id="buttonclicker">
        </div>

        <div class="Stage">
            <img class="OruamPNG" src="https://i.ibb.co/ZP5hdWf/oruam-1.png" alt="">
        </div>

        <div class="upgradeMenu">
            <h1>Upgrades</h1>
            <div id="BtnsUPGM" class="Click">
                <p>CLICK</p>
                <div class="hoverdiv">
                    <p>Value:</p>
                    <p class="priceClickUPG"> </p>
                </div>
            </div>
            <div id="BtnsUPGM" class="Foguetes">
                <p>FOGUETES</p>
                <div id="fogueteshover" class="hoverdiv">
                    <p>Value:</p>
                    <p class="priceFoguetesUPG"> </p>
                </div>
            </div>
            <div id="BtnsUPGM" class="Fumacas">
                <p>FUMAÇAS</p>
                <div id="fumacashover" class="hoverdiv">
                    <p>Value:</p>
                    <p class="priceFumacasUPG"> </p>
                </div>
            </div>
            <div id="BtnsUPGM" class="Oruam">
                <p>ORUAM</p>
                <div id="oruamhover" class="hoverdiv">
                    <p>Value:</p>
                    <p class="priceOruamUPG"> </p>
                </div>
            </div>
            <div id="BtnsUPGM" class="Rebirth">
                <p>REBIRTH</p>
                <div id="rebirthhover" class="hoverdiv">
                    <p>Value:</p>
                    <p class="priceRebirthUPG"> </p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
